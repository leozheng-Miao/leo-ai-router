spring:
  application:
    name: leo-ai-router
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.leo.airouterbackend.controller

mail:
  from: ${LEO_MAIL_FROM:}
  code-expire: ${LEO_MAIL_CODE_EXPIRE_SECONDS:300}
  code-cool-down: ${LEO_MAIL_CODE_COOL_DOWN_SECONDS:60}

auth:
  jwt:
    issuer: ${LEO_AUTH_JWT_ISSUER:leo-ai-router}
    access-token-ttl-seconds: ${LEO_AUTH_ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${LEO_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}

tencent:
  sms:
    enabled: ${TENCENT_SMS_ENABLED:false}
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    login-template-id: ${TENCENT_SMS_LOGIN_TEMPLATE_ID:}
    local-code-visible: ${TENCENT_SMS_LOCAL_CODE_VISIBLE:false}
    code-expire-minutes: ${TENCENT_SMS_CODE_EXPIRE_MINUTES:5}
    code-cool-down-seconds: ${TENCENT_SMS_CODE_COOL_DOWN_SECONDS:60}

app:
  async:
    core-pool-size: ${LEO_ASYNC_CORE_POOL_SIZE:8}
    max-pool-size: ${LEO_ASYNC_MAX_POOL_SIZE:32}
    queue-capacity: ${LEO_ASYNC_QUEUE_CAPACITY:200}
    request-timeout-millis: ${LEO_ASYNC_REQUEST_TIMEOUT_MILLIS:60000}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
