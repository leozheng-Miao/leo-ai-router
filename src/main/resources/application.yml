spring:
  application:
    name: leo-ai-router
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/leo_ai_router?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: clx740329
  # Session
  session:
    store-type: redis
    # session 30 ???
    timeout: 2592000
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 ???
    session:
      cookie:
        max-age: 2592000
# MyBatis Flex
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.leo.airouterbackend.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# ?????????
mail:
  from: 1154027884@qq.com
  code-expire: 300      # ?????????
  code-cool-down: 60    # ?????????
auth:
  jwt:
    secret: ${LEO_AUTH_JWT_SECRET:E9WjGC8K3X1eZf9kB3jUaqKPRMqLxWxzrz8mtCfMSpwuRSZmtwjgG/thHAdL0sUN/p8fVTBNxTC2hAloUl3Opw==}
    issuer: leo-ai-router
    access-token-ttl-seconds: 7200
    refresh-token-ttl-seconds: 2592000
tencent:
  sms:
    enabled: ${TENCENT_SMS_ENABLED:false}
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    login-template-id: ${TENCENT_SMS_LOGIN_TEMPLATE_ID:}
    local-code-visible: ${TENCENT_SMS_LOCAL_CODE_VISIBLE:true}
    code-expire-minutes: 5
    code-cool-down-seconds: 60
wechat:
  oauth:
    enabled: ${WECHAT_OAUTH_ENABLED:false}
    app-id: ${WECHAT_OAUTH_APP_ID:}
    app-secret: ${WECHAT_OAUTH_APP_SECRET:}
    redirect-uri: ${WECHAT_OAUTH_REDIRECT_URI:http://localhost:5173/oauth/wechat/callback}
    frontend-success-url: ${WECHAT_OAUTH_FRONTEND_SUCCESS_URL:http://localhost:5173/oauth/wechat/callback}
    state-ttl-seconds: 300
logging:
  level:
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.http: DEBUG
# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
